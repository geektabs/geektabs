    <meta property="og:description" content="A minimalist, aesthetic productivity dashboard with immersive wallpapers, smart widgets, and integrated search." />
    <script>
      (function() {
        var originalFetch = window.fetch;
        var currentFetch = originalFetch;
        try {
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() { return currentFetch; },
            set: function(val) { currentFetch = val; }
          });
        } catch (e) {
          console.warn('Unable to patch window.fetch:', e);
        }
        if (typeof globalThis !== 'undefined' && globalThis !== window) {
          try {
            Object.defineProperty(globalThis, 'fetch', {
              configurable: true,
              enumerable: true,
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; }
            });
          } catch (e) {
            console.warn('Unable to patch globalThis.fetch:', e);
          }
        }
      })();
    </script>
